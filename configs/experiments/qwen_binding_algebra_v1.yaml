device: cuda
dtype: float32
capture_activation_dtype: float32
attn_implementation: eager
local_files_only: true
max_sequence_length: 96
seed: 499
execution_authorized: false
claim_boundary: causal permutation-operator test, not demonstrated novelty, circuit, J-space, workspace, or consciousness evidence

splits:
  calibration:
    count: 16
    seed: 503
    template: primary
  train:
    count: 192
    seed: 509
    template: primary
  validation:
    count: 64
    seed: 521
    template: primary
  test:
    count: 64
    seed: 523
    template: primary
  paraphrase:
    count: 64
    paired_with: test
    template: paraphrase

token_pools:
  keys:
    calibration: [alder, beryl, cirrus, dahlia]
    train: [acorn, beacon, canyon, domino, elm, fable, galaxy, hearth, inlet, juniper, kelp, lagoon, meadow, nectar, opal, pebble, quill, reef, summit, tundra, umber, vortex, willow, xenon]
    validation: [yarrow, zephyr, anvil, brook, cipher, dune, echo, fjord]
    test: [garnet, hazel, islet, jigsaw, kernel, lichen, mosaic, nickel]
  values:
    calibration: [crimson, cobalt, saffron, violet]
    train: [Albany, Beirut, Chennai, Dresden, Exeter, Fresno, Geneva, Hobart, Izmir, Jaipur, Kigali, Lyon, Manila, Naples, Ottawa, Perth, Quito, Riga, Suva, Taipei, Utrecht, Venice, Wuhan, Yangon]
    validation: [Accra, Basel, Cusco, Doha, Essen, Fez, Graz, Haifa]
    test: [Irvine, Juba, Kyoto, Leeds, Malmo, Nuuk, Odesa, Pisa]

permutation_convention:
  slot_count: 4
  mapping: source_slot_to_destination_slot
  composition_order: first_then_second
  query_must_change: true
action_partition:
  train_classes: [transposition]
  held_out_classes: [double_transposition, three_cycle, four_cycle]
  train_generators: all_six_transpositions
  validation_and_test_targets: all_query_changing_held_out_actions
  paraphrase_pairing: exact_test_episode_and_action
  identity_control: true

treatment:
  site: blocks.0.resid_pre
  operation: patch
  positions: all_value_positions_changed_by_permutation
  ground_truth: direct_permuted_prompt_and_exact_layer0_replay
capture:
  position: final_query
  trajectory_sites: [blocks.14.resid_post, blocks.18.resid_post, blocks.21.resid_post, blocks.24.resid_post, blocks.27.resid_post]
  direct_verification_site: blocks.21.resid_post
  state_target: treated_minus_clean_fp32
  behavior_target: four_candidate_logits_reindexed_by_episode_role
  full_residual_state_target_forbidden: true
  donor_activation_as_predictor_input_forbidden: true

meta_model:
  family: ema_stop_gradient_delta_trajectory_intervention_jepa
  clean_context_site: blocks.14.resid_post
  action_encoding: fixed_4_by_4_permutation_matrix
  shared_layer_encoder_hidden_dim: 48
  meta_dim: 16
  recurrent_hidden_dim: 48
  maximum_trainable_parameters: 150000
  training_seeds: [541, 547, 557]
  train_rollout_length: 1
  evaluation_rollout_lengths: [2, 3]
  target_encoder_ema_decay: 0.99
  stop_gradient_target: true
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_projections: 64
  early_stopping_split: validation
  token_ids_as_features_forbidden: true
  train_on_composed_targets_forbidden: true
loss:
  latent_alignment_weight: 1.0
  trajectory_delta_weight: 1.0
  role_logit_delta_weight: 1.0
  behavior_weight: 0.5
  composition_consistency_weight: 0.5
  identity_noop_weight: 0.25

baselines:
  methods: [no_change, mean_effect, direct_primitive_addition, exact_local_jvp, population_jacobian, full_quadratic_hvp, oracle_relinearized_sequential_jvp, ridge, low_rank_bilinear, capacity_matched_mlp]
  exact_local_jvp_precision: float32
  full_quadratic_cross_terms: included
  population_fit_split: train_only
  learned_baseline_parameter_cap: 150000
  direct_primitive_targets_train_only: true

controls:
  wrong_permutation_same_class: true
  inverse_rollout: true
  identity_noop: true
  donor_shuffle: true
  norm_matched_delta: true
  role_relabel_equivariance: true
  exact_test_paraphrase_pairing: true
  split_by_complete_key_and_value_alphabet: true
  episode_clustered_inference: true

gates:
  clean_accuracy_min_each_split: 0.90
  direct_permutation_accuracy_min_each_split: 0.90
  exact_layer0_replay_atol: 1.0e-6
  composition_interaction_power_min: 0.10
  best_quadratic_normalized_mse_min: 0.10
  meta_model_mse_ratio_to_best_baseline_max: 0.80
  behavior_agreement_margin_min: 0.10
  paired_bootstrap_advantage_lower_min: 0.0
  predicted_state_patch_recovery_min: 0.50
  predicted_state_control_margin_min: 0.20
  inverse_restoration_min: 0.75
  seeds_required: 3
  protected_splits_required: [test, paraphrase]
  bootstrap_draws: 10000
  bootstrap_seed: 563

phase_policy:
  phase_0: direct_and_differential_nonlinearity_audit
  phase_0_decision_split: validation_only
  phase_1: train_meta_model_only_if_phase_0_passes
  protected_outcomes_remain_closed_until_phase_1_is_frozen: true
  phase_0_failure_status: COMPLETED_NEGATIVE_LOCALLY_DIFFERENTIAL
  prediction_without_direct_patch_status: AVAILABILITY_ONLY
  any_protected_failure_status: HYPOTHESIS_REJECTED

activation_budget_mb: 1024
max_shard_mb: 256
output_dir: data/activations/qwen_binding_algebra_v1
output_manifest: data/manifests/qwen_binding_algebra_v1.json
output_metrics: artifacts/metrics/qwen_binding_algebra_v1.json
