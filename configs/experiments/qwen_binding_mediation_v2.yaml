    steps: 1
    precision: float32
  atp_star:
    variant: sequential_residual_semilayer_graddrop
    dropped_sites: all_56_attn_out_and_mlp_out
    aggregation: sum_absolute_over_drops_divided_by_55_then_mean_over_episodes
    qk_fix: not_applicable_post_o_proj_nodes
  leave_value_out_probe:
    target: treatment_score_effect
    held_out_group: donor_answer_id
    projection: fixed_gaussian
    projection_dim: 32
    projection_seed: 463
    ridge: 1.0e-3
    score: negative_out_of_fold_mse
