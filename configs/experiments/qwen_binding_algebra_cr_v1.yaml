# B0--B4 are locked before any protected row can be opened.  A phase may only
# consume the listed splits and must stop with its declared status on failure.
phase_locks:
  B0:
    name: competence_and_layer0_replay
    order: 0
    allowed_splits: [calibration, train, validation]
    decision_split: validation
    requires_previous_pass: false
    requires_execution_authorization: true
    schema_only_dry_run_without_authorization: true
    qwen_execution_without_authorization: false
    stop_status: INELIGIBLE_TASK
  B1:
    name: differential_baselines_and_residual_power
    order: 1
    allowed_splits: [calibration, train, validation]
    decision_split: validation
    requires_previous_pass: B0
    requires_execution_authorization: true
    schema_only_dry_run_without_authorization: true
    qwen_execution_without_authorization: false
    stop_status: COMPLETED_NEGATIVE_LOCALLY_DIFFERENTIAL
    residual_power_gate: composition_interaction_power_min
    oracle_excluded_from_residual_power: true
  B2:
    name: residual_target_sufficiency_and_nuisance
    order: 2
    allowed_splits: [train, validation]
    decision_split: validation
    requires_previous_pass: B1
    requires_execution_authorization: true
    schema_only_dry_run_without_authorization: true
    qwen_execution_without_authorization: false
    stop_status: TARGET_REJECTED_NUISANCE_OR_REPLAY
  B3:
    name: frozen_residual_ijepa_training
    order: 3
    allowed_splits: [train, validation]
    decision_split: validation
    requires_previous_pass: B2
    requires_execution_authorization: true
    schema_only_dry_run_without_authorization: true
    qwen_execution_without_authorization: false
    training_seeds: [541, 547, 557]
    protected_access: forbidden
    stop_status: NEGATIVE_RESULT
  B4:
    name: protected_direct_predicted_state_replay
    order: 4
    allowed_splits: [test, paraphrase]
    decision_split: protected_only_after_frozen_primary
    requires_previous_pass: B3
    requires_execution_authorization: true
    requires_clean_pushed_commit: true
    requires_self_hashed_plan: true
    exactly_one_protected_primary: true
    protected_results_select_methods: false
    interpretability_comparisons: [sae, qwen_scope, transcoder, atp_star, jacobian_rankings]
    feature_claim_requires_direct_ablation_or_patch: true
    schema_only_dry_run_without_authorization: true
    qwen_execution_without_authorization: false
    stop_status: HYPOTHESIS_REJECTED

phase_policy:
  phase_0: direct_and_differential_nonlinearity_audit
  phase_0_decision_split: validation
  phase_1: train_residual_meta_model_only_if_B0_B1_B2_pass
  phase_2: protected_direct_replay_only_after_B3_and_authorization
  protected_requires_frozen_phase_1: true
  phase_0_failure_status: COMPLETED_NEGATIVE_LOCALLY_DIFFERENTIAL
  prediction_without_direct_patch_status: AVAILABILITY_ONLY
  any_protected_failure_status: HYPOTHESIS_REJECTED
  access:
    phase_0:
      allowed_splits: [calibration, train, validation]
      output_root: data/activations/qwen_binding_algebra_cr_v1/phase_0
    phase_1_train:
      allowed_splits: [train, validation]
      output_root: data/activations/qwen_binding_algebra_cr_v1/phase_1_train
    protected_eval:
      allowed_splits: [test, paraphrase]
      output_root: data/activations/qwen_binding_algebra_cr_v1/protected_eval
