stage_0:
  name: deterministic_observable_residual_audit
  execution_authorized: true
  protected: false
  resource_profile: configs/resource/cpu_vps.yaml
  deterministic: true
  seeds: [0, 1, 2]
  systems: [linear, quadratic, nonlinear_compositional, predictable_nuisance]
  observable_targets: [clean_state, treated_state, action_effect, residual_effect]
  state_source: observable_ground_truth_physical_state
  frozen_encoder: true
  target_is_observable_or_frozen_encoder: true
  learning_allowed: conditional_after_finite_residual_floor
  no_learning_before_floors: true
  cartesian_factorial_expansion: forbidden
  residual_definition: delta_u_minus_frozen_baseline_star
  delta_definition: x_u_minus_x
  target_definition: residual_u_equals_delta_u_minus_baseline_star_x_u
  nuisance_is_planted_and_predictable: true
  expected_outcome_controls:
    linear: no_learned_discovery
    quadratic: no_learned_discovery
    nonlinear_compositional: nonlinear_replay_improvement_required
    predictable_nuisance: nuisance_guard_must_detect_weak_causal_signal
  finite_residual:
    energy_metric: mean_squared_l2_residual_over_mean_squared_l2_delta
    minimum_relative_energy: 0.05
    minimum_absolute_energy: 1.0e-12
    repeatability_metric: one_minus_normalized_rmse_across_repeated_generation
    minimum_repeatability: 0.99
    maximum_repeatability_rmse: 1.0e-6
    required_repetitions: 3
    seeds_must_be_distinct: true
    gate_before_residual_learning: true
    nonfinite_is_failure: true
  frozen_targets:
    target_encoder: frozen_before_split_and_fit
    decoder: frozen_train_only_decoder
    normalization: fit_train_only_then_frozen
    baseline_star: selected_before_residual_model_fit
    drift_report_required: true
    collapse_report_required: true
    replay_report_required: true
    no_ema_guarantee: true
  subphases:
    baseline_and_floor:
      learning_allowed: false
      role: deterministic_baseline_selection_and_finite_repeatability
      requires: [observable_targets, frozen_baseline_star, finite_residual_floor]
    eligible_synthetic_residual_learning:
      learning_allowed: true
      role: train_and_test_cr_residual_on_synthetic_systems_after_floor
      requires: [baseline_and_floor_pass, train_validation_split, frozen_target_statistics]
      nonlinear_replay_improvement_required: true
      linear_and_quadratic_zero_discovery_expected: true
      protected_access: false
      cartesian_factorial_expansion: forbidden

baseline_target_selection:
  target: residual_endpoint_or_residual_trajectory_only
  complete_state_prediction_is_control: true
  deployability_contract: same_observable_source_executions_and_inference_budget_as_predictor
  eligible_baselines: [no_change, train_mean_effect, exact_local_jvp, quadratic_hvp, population_differential, pca_ridge_causal_delta, train_affine_transport, equivariant_transport]
  deployable_residualizers_only: true
  fair_comparators: [no_change, train_mean_effect, exact_local_jvp, quadratic_hvp, population_differential, pca_ridge_causal_delta, train_affine_transport, equivariant_transport, complete_delta, complete_state, bilinear, mlp, sparse_student]
  oracle_ceilings: [observed_prefix_relinearization, exact_treated_prefix_reexecution]
  oracle_can_select_baseline: false
  oracle_can_define_target: false
  target_encoder_forbidden_inputs: [sample_id, answer_label, protected_metadata, treated_state_at_inference, unavailable_execution]
  selection:
    split: train_validation_only
    endpoint: normalized_residual_mse
    aggregation: macro_mean_over_episode_groups
    tie_break: [endpoint_then_method_name_lexicographic]
    selection_record_required: true
    selection_record_hashed: true
    freeze_before_protected: true
  baseline_star:
    selected_only_from_eligible: true
    frozen_before_learning: true
    normalized_with_train_only_statistics: true
    selection_is_not_outcome_adaptive: true

