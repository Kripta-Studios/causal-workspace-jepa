name: cpu-ci
on:
  push:
  pull_request:
jobs:
  nonprotected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Entrypoint syntax
        run: python -m pytest -q tests/unit/test_qwen_competence_recovery_entrypoints.py
      - name: Unit scientific integration
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit tests/integration tests/scientific -m "not gpu and not slow"
      - name: Reproducibility audit
        run: python scripts/audit_reproducibility.py
